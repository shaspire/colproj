<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.png" type="image/x-icon">
	<link rel="stylesheet" href="style.css">
	<title>Web-Rice</title>
	<style id="colorscheme"></style>
</head>
<body style="background-position-x: 50%">
	<header>
		<!-- LEFT -->
		<div class="bar-container">
			<nav id="bar-workspaces" class="bar-container-item bg0 flex-centered">
				<button onclick="switchDesktop(0)" class="nav-item purple">I</button>
				<button onclick="switchDesktop(1)" class="nav-item purple">II</button>
				<button onclick="switchDesktop(2)" class="nav-item purple">III</button>
				<button onclick="switchDesktop(3)" class="nav-item purple">IV</button>
				<button onclick="switchDesktop(4)" class="nav-item purple">V</button>
			</nav>
		</div>
		<!-- MID -->
		<div class="bar-container">
			<div class="bar-container-item flex-centered bg0">
				<p class="flex-centered" id="time"></p>
			</div>
		</div>
		<!-- RIGHT -->
		<div class="bar-container">
			<select id="background-select" class="bar-container-item"></select>
			<select id="colorscheme-select" class="bar-container-item"></select>
		</div>
	</header>

	<main id="desktop">
		<!-- Check out this random rice -->
		<section class="workspace">
			<div class="workspace-content">
				<h1>First</h1>
			</div>
		</section>
		<!-- Duh -->
		<section class="workspace">
			<div class="workspace-content">
				<h1>Second</h1>
			</div>
		</section>
		<!-- UNIX is Beautiful -->
		<section class="workspace">
			<div class="workspace-content">
				<h1 class="bg0">UNIX is Beautiful<span class="fg00">(except macos, ios and other apple scammy "products")</span></h1>
			</div>
		</section>
		<!-- This text is here to be there -->
		<section class="workspace">
			<div class="workspace-content">
				<h1>Fourth</h1>
			</div>
		</section>
		<!-- I use Arch btw lol(cuz i dunno what to put here)-->
		<section class="workspace">
			<div class="workspace-content">
				<h1>Fifth</h1>
			</div>
		</section>
	</main>

	<script src="data.js"></script>
	<script defer src="main.js"></script>
</body>
</html>
